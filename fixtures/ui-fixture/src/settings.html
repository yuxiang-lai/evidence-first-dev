<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
      body { margin: 0; background: var(--color-page); color: var(--color-ink); font: 16px/1.5 sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: var(--space-3); }
      section { background: var(--color-panel); border-radius: var(--radius-panel); padding: var(--space-3); }
      label { display: block; margin-bottom: var(--space-2); }
      input { width: 100%; box-sizing: border-box; padding: var(--space-2); }
      button { margin-top: var(--space-3); background: var(--color-accent); color: white; padding: var(--space-2) var(--space-3); }
      @media (max-width: 480px) { main { padding: var(--space-2); } }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="settings-title">
        <h1 id="settings-title">Settings</h1>
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" value="Example">
        <button type="button" data-action="save">Save</button>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
